<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Performance Patterns</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body><main class="page"><p class="eyebrow">Performance lab</p><h1>Fast interfaces feel better.</h1><p>Use the checklist to inspect a sample UI and mark the improvements you have verified.</p><section class="checklist" aria-label="Performance checklist"><label><input type="checkbox"> Images have intrinsic width and height</label><label><input type="checkbox"> Non-critical scripts are deferred</label><label><input type="checkbox"> Large images are appropriately sized</label><label><input type="checkbox"> Layout shift and long tasks are inspected</label><label><input type="checkbox"> Fonts and third-party resources are limited</label></section><p id="summary" role="status" aria-live="polite"></p></main></body></html>

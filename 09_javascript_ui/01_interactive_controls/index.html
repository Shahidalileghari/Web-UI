<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Interactive UI</title><link rel="stylesheet" href="styles.css"></head><body><main class="panel"><p class="eyebrow">Browser JavaScript</p><h1>Interactive controls</h1><p>Change the counter or switch the theme.</p><div class="counter"><button id="decrease" aria-label="Decrease counter">−</button><output id="count" aria-live="polite">0</output><button id="increase" aria-label="Increase counter">+</button></div><button id="theme-toggle" class="secondary" aria-pressed="false">Switch theme</button><button id="reset">Reset counter</button></main><script src="app.js"></script></body></html>
